
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install dash numpy matplotlib plotly

      - name: Run simulation test
        run: |
          python simulate_model5.py --steps 10 --gamma_5 0.01 --m 1.0

      - name: Verify Dash script syntax
        run: python -m py_compile model5_dashboard_full.py
